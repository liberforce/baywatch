[project]
name = "baywatch"
version = "0.2.0.dev2"
description = "Web page watcher and change notifier."
readme = "README.md"
requires-python = ">=3.7"
dependencies = [
    "python-dotenv",
    "requests>=2.21.0",
]

[dependency-groups]
dev = [
    "black",
    "isort",
    "mypy",
    "ruff",
    "types-requests>=2.21.0",
]
